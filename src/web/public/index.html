<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Qwipo · Build &amp; Release</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1d212b; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #8b93a3; --accent: #5b8cff; --accent-2: #3d6bff;
    --ok: #3ecf8e; --warn: #f5b14c; --err: #ff6b6b; --chip: #232838;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  /* Sound toggle — minimal dark bell icon button */
  .sound-toggle {
    margin-left: auto; display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; padding: 0; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--muted); transition: color .15s, border-color .15s, background .15s;
  }
  .sound-toggle:hover { color: var(--text); border-color: var(--accent); }
  .sound-toggle .bell { display: block; }
  .sound-toggle .bell .slash { opacity: 0; transition: opacity .15s; }
  /* On = active accent bell; Off = muted bell with a slash */
  .sound-toggle.on { color: var(--accent); border-color: var(--accent); }
  .sound-toggle:not(.on) .bell .slash { opacity: 1; }
  .layout { display: grid; grid-template-columns: 340px 1fr; gap: 0; height: calc(100vh - 57px); }
  .left { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .right { display: flex; flex-direction: column; min-height: 0; }
  .panel-head {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .panel-head h2 { font-size: 13px; margin: 0; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .search {
    margin: 10px 16px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); width: calc(100% - 32px); outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .service-list { overflow-y: auto; padding: 0 8px 12px; flex: 1; min-height: 0; }
  .service-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer;
  }
  .service-item:hover { background: var(--panel); }
  .service-item .name { font-size: 13px; }
  /* Custom dark checkbox (services, parallel, secret toggles) */
  input[type="checkbox"] {
    appearance: none; -webkit-appearance: none; margin: 0; flex: none;
    width: 18px; height: 18px; border-radius: 5px; cursor: pointer; position: relative;
    border: 1.5px solid var(--border); background: var(--panel-2);
    transition: background .12s, border-color .12s;
  }
  input[type="checkbox"]:hover { border-color: var(--accent); }
  input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
  input[type="checkbox"]:checked::after {
    content: ""; position: absolute; left: 5px; top: 1.5px;
    width: 4px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .service-item .ids { color: var(--muted); font-size: 11px; margin-left: auto; }
  .btn {
    background: var(--accent-2); color: #fff; border: none; border-radius: 8px; padding: 8px 14px;
    font-weight: 600; cursor: pointer; font-size: 13px;
  }
  .btn:hover { background: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn.ghost:hover { color: var(--text); border-color: var(--accent); }
  .selected-area { overflow-y: auto; padding: 16px; flex: 1; min-height: 0; }
  .empty { color: var(--muted); text-align: center; margin-top: 60px; font-size: 13px; }
  .job-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; margin-bottom: 12px;
  }
  .job-top { display: flex; align-items: center; gap: 12px; }
  .job-top .svc { font-weight: 600; font-size: 14px; }
  .job-top .remove { margin-left: auto; cursor: pointer; color: var(--muted); border: none; background: none; font-size: 16px; }
  .job-top .remove:hover { color: var(--err); }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  label.fld { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; outline: none; min-width: 180px;
  }
  select:focus { border-color: var(--accent); }
  /* searchable-select (combobox) — dark, type-to-filter dropdown */
  .ss { position: relative; display: inline-block; min-width: 160px; }
  .ss-display {
    width: 100%; text-align: left; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 28px 7px 10px;
    outline: none; cursor: pointer; font: inherit; position: relative; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .ss-display:hover:not(:disabled) { border-color: var(--accent); }
  .ss.open .ss-display { border-color: var(--accent); }
  .ss-display:disabled { opacity: .5; cursor: not-allowed; }
  .ss-display.placeholder { color: var(--muted); }
  .ss-caret { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted); display: flex; }
  .ss-panel {
    display: none; position: absolute; z-index: 40; top: calc(100% + 4px); left: 0;
    min-width: 100%; width: max-content; max-width: 320px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45); overflow: hidden;
  }
  .ss.open .ss-panel { display: block; }
  .ss-search {
    width: 100%; box-sizing: border-box; background: var(--panel-2); color: var(--text);
    border: none; border-bottom: 1px solid var(--border); padding: 8px 10px; outline: none; font: inherit;
  }
  .ss-search::placeholder { color: var(--muted); }
  .ss-list { max-height: 260px; overflow-y: auto; padding: 4px; }
  .ss-opt { padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .ss-opt:hover, .ss-opt.active { background: var(--panel-2); }
  .ss-opt.sel { color: var(--accent); }
  .ss-opt.sel::after { content: "✓"; float: right; margin-left: 12px; }
  .ss-empty { padding: 10px; color: var(--muted); font-size: 12px; text-align: center; }
  .env-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .env-toggle button { background: var(--panel-2); color: var(--muted); border: none; padding: 7px 14px; cursor: pointer; font-size: 12px; }
  .env-toggle button.active { background: var(--accent-2); color: #fff; }
  .footer {
    border-top: 1px solid var(--border); padding: 14px 16px; display: flex; align-items: center; gap: 12px;
  }
  .footer .summary { color: var(--muted); font-size: 12px; margin-right: auto; }
  /* progress */
  .progress { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 10px; display: none; }
  .progress.show { display: block; }
  .step { display: flex; align-items: center; gap: 10px; padding: 4px 0; font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); flex: none; }
  .dot.queued { background: var(--warn); }
  .dot.running { background: var(--accent); animation: pulse 1s infinite; }
  .dot.succeeded { background: var(--ok); }
  .dot.failed, .dot.error { background: var(--err); }
  .dot.skipped { background: var(--muted); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .step .label { text-transform: capitalize; }
  .step .meta { color: var(--muted); font-size: 12px; }
  .step a { color: var(--accent); text-decoration: none; }
  .step a:hover { text-decoration: underline; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 20px; margin-left: auto; }
  .badge.ok { background: rgba(62,207,142,.15); color: var(--ok); }
  .badge.err { background: rgba(255,107,107,.15); color: var(--err); }
  .warn-note { color: var(--warn); font-size: 11px; margin-top: 4px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--border); padding: 10px 16px; border-radius: 8px;
    font-size: 13px; display: none;
  }
  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-left: 8px; }
  .tabs .tab {
    background: transparent; border: 1px solid transparent; color: var(--muted);
    padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: all .15s;
  }
  .tabs .tab:hover { color: var(--text); }
  .tabs .tab.active { background: var(--panel-2); border-color: var(--border); color: var(--text); }
  /* ONDC Search view */
  #view-ondc { height: calc(100vh - 57px); overflow: auto; }
  .ondc-wrap { display: flex; flex-direction: column; gap: 14px; padding: 18px 24px; height: 100%; min-height: 0; }
  .ondc-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ondc-url {
    font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; color: var(--muted);
    background: var(--chip); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px;
    flex: 1; min-width: 260px; word-break: break-all;
  }
  .ondc-status { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 6px; }
  .ondc-status.ok { background: rgba(62,207,142,.15); color: var(--ok); }
  .ondc-status.err { background: rgba(255,107,107,.15); color: var(--err); }
  .ondc-status.pending { background: rgba(245,177,76,.15); color: var(--warn); }
  .ondc-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; flex: 1; min-height: 0; }
  .ondc-col { display: flex; flex-direction: column; min-height: 0; }
  .ondc-col-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
  #view-ondc textarea, #view-ondc pre {
    flex: 1; min-height: 360px; width: 100%; margin: 0;
    font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5;
    padding: 12px; border-radius: 8px; border: 1px solid var(--border);
    background: #0b0d12; color: var(--text); resize: none; overflow: auto;
    white-space: pre-wrap; word-break: break-word;
  }
  #view-ondc textarea:focus { outline: none; border-color: var(--accent); }
  @media (max-width: 860px) { .ondc-panels { grid-template-columns: 1fr; } }
  /* Credentials vault */
  #view-creds { height: calc(100vh - 57px); overflow: auto; }
  .creds-wrap { padding: 18px 24px; max-width: 1000px; margin: 0 auto; }
  .creds-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .creds-hint { font-size: 11px; color: var(--warn); margin-bottom: 16px; }
  .cred-group { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 14px; background: var(--panel); }
  .cred-group-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .cred-group-head input.gname {
    background: transparent; border: none; color: var(--text); font-size: 14px; font-weight: 600;
    flex: 1; padding: 4px 6px; border-radius: 6px;
  }
  .cred-group-head input.gname:focus { outline: none; background: var(--panel-2); }
  .cred-rows { padding: 8px 12px; display: flex; flex-direction: column; gap: 8px; }
  .cred-row { display: flex; align-items: center; gap: 8px; }
  .cred-row input.clabel { width: 200px; flex: none; }
  .cred-row input.cvalue { flex: 1; font-family: 'SF Mono', Menlo, Consolas, monospace; }
  .cred-row input {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 7px 9px; font-size: 13px;
  }
  .cred-row input:focus { outline: none; border-color: var(--accent); }
  .cred-row .icon-btn {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; width: 30px; height: 30px; flex: none; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; font-size: 13px;
  }
  .cred-row .icon-btn:hover { color: var(--text); border-color: var(--accent); }
  .cred-row label.secret-tg { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); white-space: nowrap; cursor: pointer; }
  .cred-row .del { color: var(--err); }
  .cred-empty { color: var(--muted); font-size: 13px; padding: 24px; text-align: center; }
  .copied-flash { color: var(--ok) !important; border-color: var(--ok) !important; }
  /* read-only display rows */
  .cred-group-head .gname-txt { flex: 1; font-size: 14px; font-weight: 600; padding: 4px 6px; }
  .cred-row .clabel-txt { width: 200px; flex: none; color: var(--muted); font-size: 13px; }
  .cred-row .cval { flex: 1; font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; word-break: break-all; }
  .cred-row .cval.masked { letter-spacing: 2px; color: var(--muted); }
  .cred-row.editing { background: var(--panel-2); border-radius: 8px; padding: 6px; }
  /* ⋮ overflow menu */
  .dots-wrap { position: relative; flex: none; }
  .dots-menu {
    position: absolute; right: 0; top: 34px; z-index: 30; display: none; min-width: 150px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  .dots-menu.open { display: block; }
  .dots-item {
    display: block; width: 100%; text-align: left; background: transparent; border: none;
    color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  .dots-item:hover { background: var(--chip); }
  .dots-item.danger { color: var(--err); }
</style>
</head>
<body>
<header>
  <h1>Qwipo</h1>
  <nav class="tabs">
    <button class="tab active" data-view="deploy">Build &amp; Release</button>
    <button class="tab" data-view="ondc">ONDC Search</button>
    <button class="tab" data-view="creds">Credentials</button>
  </nav>
  <button id="sound-toggle" class="sound-toggle" title="Completion sound" aria-pressed="true">
    <svg class="bell" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      <line class="slash" x1="3" y1="3" x2="21" y2="21"/>
    </svg>
  </button>
</header>

<div id="view-deploy" class="view">
<div class="layout">
  <!-- LEFT: services multi-select -->
  <div class="left">
    <div class="panel-head">
      <h2>Services</h2>
      <span id="svc-count" class="sub" style="color:var(--muted);font-size:12px;"></span>
    </div>
    <input id="search" class="search" placeholder="Search services…" />
    <div id="service-list" class="service-list"></div>
  </div>

  <!-- RIGHT: selected jobs with branch selection + progress -->
  <div class="right">
    <div class="panel-head" style="justify-content:flex-start;flex-wrap:wrap;">
      <label class="fld">Action</label>
      <select id="action" style="min-width:140px;">
        <option value="build-release" selected>Build &amp; Release</option>
        <option value="build">Build only</option>
        <option value="release">Release only</option>
      </select>
      <label id="parallel-lbl" class="fld" style="display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;">
        <input type="checkbox" id="parallel" style="margin:0;cursor:pointer;" />
        Trigger all in parallel
      </label>
      <label class="fld">Build branch</label>
      <div id="build-branch" style="min-width:160px;"></div>
      <label class="fld">Release env</label>
      <select id="release-env" style="min-width:120px;">
        <option value="dev" selected>dev</option>
        <option value="testing">testing</option>
        <option value="production">production</option>
      </select>
      <button id="clear" class="btn ghost" style="margin-left:auto;">Clear all</button>
    </div>
    <div id="selected" class="selected-area">
      <div class="empty">Pick one or more services on the left.<br/>Each gets a build-branch dropdown here.</div>
    </div>
    <div class="footer">
      <span id="summary" class="summary"></span>
      <button id="deploy" class="btn" disabled>Build &amp; Release</button>
    </div>
  </div>
</div>
</div>

<!-- ONDC SEARCH view -->
<div id="view-ondc" class="view" style="display:none;">
  <div class="ondc-wrap">
    <div class="ondc-bar">
      <label class="fld">Environment</label>
      <select id="ondc-env" style="min-width:170px;">
        <option value="dev" selected>DEV</option>
        <option value="test">TEST</option>
        <option value="prod">PROD (MAIN)</option>
      </select>
      <span id="ondc-url" class="ondc-url"></span>
      <button id="ondc-regen" class="btn ghost">Regenerate IDs</button>
      <button id="ondc-trigger" class="btn">Trigger Search</button>
      <span id="ondc-status" class="ondc-status"></span>
    </div>
    <div class="ondc-panels">
      <div class="ondc-col">
        <div class="ondc-col-head">
          <span>Request Payload (inner body)</span>
          <span id="ondc-ids" class="sub" style="font-size:11px;"></span>
        </div>
        <textarea id="ondc-payload" spellcheck="false"></textarea>
      </div>
      <div class="ondc-col">
        <div class="ondc-col-head">
          <span>Response</span>
          <span id="ondc-meta" class="sub" style="font-size:11px;"></span>
        </div>
        <pre id="ondc-response">Awaiting trigger…</pre>
      </div>
    </div>
  </div>
</div>

<!-- CREDENTIALS / REFERENCE vault view -->
<div id="view-creds" class="view" style="display:none;">
  <div class="creds-wrap">
    <div class="creds-bar">
      <input id="creds-search" class="search" style="max-width:280px;" placeholder="Search credentials…" />
      <button id="creds-add-group" class="btn ghost">+ Add group</button>
      <span id="creds-status" class="sub" style="margin-left:auto;"></span>
      <button id="creds-save" class="btn">Save</button>
    </div>
    <div class="creds-hint sub">Stored locally on this machine in a gitignored file. Don't put production secrets here unless you trust this host.</div>
    <div id="creds-groups"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const state = {
  services: [],            // [{name, buildPipelineId, releasePipelineId}]
  defaultBranches: ["dev","testing","main"],
  selected: new Map(),     // name -> { progress:{} }
  branch: "dev",           // overall build branch for all services
  branches: null,          // union of branches across selected services (lazy)
  branchesLoaded: false,
  branchesLoading: false,
  environment: "dev",      // overall release env for all services
  action: "build-release", // build-release | build | release
  parallel: false,         // trigger all-at-once (only for build-only / release-only)
  running: false,
};
let pollTimer = null;

const $ = (sel) => document.querySelector(sel);
const el = (tag, props={}, ...kids) => {
  const n = document.createElement(tag);
  Object.entries(props).forEach(([k,v]) => {
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  });
  kids.forEach(k => n.append(k));
  return n;
};
const toast = (msg) => {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(t._t); t._t = setTimeout(() => t.style.display = "none", 3200);
};

// ---- searchable-select: a dark, type-to-filter combobox replacing <select> ----
// opts: { value, placeholder, onChange(v), onOpen() }. Options are [{value,label}]
// or plain strings. The returned element exposes .ss = { setOptions, setLoading,
// getValue, setValue, setDisabled }.
function closeAllSS(except) {
  document.querySelectorAll(".ss.open").forEach((w) => { if (w !== except) w.classList.remove("open"); });
}
function searchableSelect(opts = {}) {
  let options = [], current = opts.value || "", loading = false, disabled = false, active = -1;
  const display = el("button", { class: "ss-display", type: "button" });
  display.append(el("span", { class: "ss-label" }), el("span", { class: "ss-caret",
    html: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>' }));
  const labelSpan = display.querySelector(".ss-label");
  const search = el("input", { class: "ss-search", type: "text", placeholder: "Search…", spellcheck: "false" });
  const list = el("div", { class: "ss-list" });
  const panel = el("div", { class: "ss-panel" }, search, list);
  const wrap = el("div", { class: "ss" }, display, panel);

  const labelFor = (v) => { const o = options.find((x) => x.value === v); return o ? o.label : v; };
  function renderDisplay() {
    const has = current !== "" || options.some((o) => o.value === "");
    labelSpan.textContent = current !== "" ? labelFor(current) : (labelFor("") || opts.placeholder || "Select…");
    display.classList.toggle("placeholder", current === "" && !options.some((o) => o.value === ""));
  }
  function renderList() {
    list.innerHTML = "";
    if (loading) { list.append(el("div", { class: "ss-empty" }, "Loading…")); return; }
    const f = search.value.trim().toLowerCase();
    const items = options.filter((o) => o.label.toLowerCase().includes(f));
    if (!items.length) { list.append(el("div", { class: "ss-empty" }, "No matches")); return; }
    items.forEach((o, i) => {
      const opt = el("div", { class: "ss-opt" + (o.value === current ? " sel" : "") + (i === active ? " active" : ""),
        onclick: (e) => { e.stopPropagation(); choose(o.value); } }, o.label);
      list.append(opt);
    });
  }
  function open() {
    if (disabled) return;
    closeAllSS(wrap); wrap.classList.add("open");
    search.value = ""; active = -1; renderList(); search.focus();
    if (opts.onOpen) opts.onOpen();
  }
  function close() { wrap.classList.remove("open"); }
  function choose(v) { current = v; renderDisplay(); close(); if (opts.onChange) opts.onChange(v); }

  display.addEventListener("click", (e) => { e.stopPropagation(); wrap.classList.contains("open") ? close() : open(); });
  search.addEventListener("click", (e) => e.stopPropagation());
  search.addEventListener("input", () => { active = -1; renderList(); });
  search.addEventListener("keydown", (e) => {
    const items = options.filter((o) => o.label.toLowerCase().includes(search.value.trim().toLowerCase()));
    if (e.key === "Escape") { close(); display.focus(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); active = Math.min(active + 1, items.length - 1); renderList(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(active - 1, 0); renderList(); }
    else if (e.key === "Enter") { e.preventDefault(); if (items[active]) choose(items[active].value); else if (items.length === 1) choose(items[0].value); }
  });

  wrap.ss = {
    setOptions(arr) { options = (arr || []).map((x) => (typeof x === "string" ? { value: x, label: x } : x)); renderDisplay(); if (wrap.classList.contains("open")) renderList(); },
    setLoading(b) { loading = b; if (wrap.classList.contains("open")) renderList(); },
    getValue() { return current; },
    setValue(v) { current = v == null ? "" : v; renderDisplay(); },
    setDisabled(b) { disabled = b; display.disabled = b; if (b) close(); },
    isOpen() { return wrap.classList.contains("open"); },
  };
  renderDisplay();
  return wrap;
}

let soundOn = localStorage.getItem("qwipo-sound") !== "off"; // default ON
function renderSoundToggle() {

// ---- failure sound (custom mp3) ----
const _errorAudio = new Audio("/sounds/faaah.mp3");

  if (!soundOn) return;
  try { _errorAudio.currentTime = 0; _errorAudio.play().catch(() => {}); } catch {}

// ---- completion chime (Web Audio — no asset needed) ----
let _audioCtx = null;
function playChime(success) {
  if (!soundOn) return;
  try {
    _audioCtx = _audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = _audioCtx;
    if (ctx.state === "suspended") ctx.resume();
    // success: rising major chord (C5→E5→G5); failure: low two-tone buzz.
    const notes = success ? [523.25, 659.25, 783.99] : [311.13, 233.08];
    notes.forEach((freq, i) => {
      const t0 = ctx.currentTime + i * 0.16;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = success ? "sine" : "triangle";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.28, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.45);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + 0.5);
    });
  } catch {}
}

// ---- load services + reattach to an in-progress run ----
async function init() {
  const res = await fetch("/api/services");
  const data = await res.json();
  state.services = data.services;
  state.defaultBranches = data.defaultBranches || state.defaultBranches;
  renderServiceList();

  // If a run is still going (e.g. the page was refreshed), reattach and resume.
  try {
    const sres = await fetch("/api/status");
    const { run } = await sres.json();
    if (run && run.status === "running") {
      state.running = true;
      applyRunSnapshot(run);
      startPolling();
    }
  } catch {}
  setRunningUI();
}

function renderServiceList() {
  const q = $("#search").value.trim().toLowerCase();
  const list = $("#service-list");
  list.innerHTML = "";
  const filtered = state.services.filter(s => s.name.toLowerCase().includes(q));
  $("#svc-count").textContent = `${state.selected.size} selected · ${filtered.length} shown`;
  filtered.forEach(s => {
    const checked = state.selected.has(s.name);
    list.append(el("label", { class: "service-item" },
      el("input", { type: "checkbox", ...(checked ? {checked:"checked"} : {}),
        onchange: (e) => toggleService(s.name, e.target.checked) }),
      el("span", { class: "name" }, s.name),
      el("span", { class: "ids" }, `#${s.buildPipelineId}/${s.releasePipelineId}`),
    ));
  });
}

function toggleService(name, on) {
  if (on) {
    // overrides default to null = inherit the global build branch / release env.
    state.selected.set(name, {
      progress: {},
      branchOverride: null, envOverride: null,
      branches: null, branchesLoaded: false, branchesLoading: false,
    });
  } else {
    state.selected.delete(name);
  }
  // Selection changed — branch union is now stale; refetch on next open.
  resetGlobalBranch();
  renderServiceList();
  renderSelected();
}

// ---- overall build branch (lazy: fetched the first time the dropdown opens) ----
// dev stays the default until the user opens the dropdown.
let globalBranchSS = null; // searchable-select instance, created in the wire-up section
function resetGlobalBranch() {
  state.branchesLoaded = false;
  state.branches = null;
  if (!globalBranchSS) return;
  // show dev/testing/main as defaults until the full list is fetched
  const cur = state.branch || "dev";
  const list = state.defaultBranches.slice();
  if (!list.includes(cur)) list.unshift(cur);
  globalBranchSS.ss.setOptions(list);
  globalBranchSS.ss.setValue(cur);
}

async function loadGlobalBranches() {
  if (state.branchesLoading || state.selected.size === 0) return;
  state.branchesLoading = true;
  if (globalBranchSS) globalBranchSS.ss.setLoading(true);
  try {
    // Union of branches across every selected service (different repos may differ).
    const names = [...state.selected.keys()];
    const lists = await Promise.all(names.map(async (n) => {
      try {
        const r = await fetch(`/api/branches?service=${encodeURIComponent(n)}`);
        const d = await r.json();
        return d.branches || [];
      } catch { return []; }
    }));
    const set = new Set();
    lists.forEach((l) => l.forEach((b) => set.add(b)));
    state.defaultBranches.forEach((b) => set.add(b)); // always offer dev/testing/main
    const all = [...set];
    const pinned = state.defaultBranches.filter((b) => all.includes(b));
    const rest = all.filter((b) => !state.defaultBranches.includes(b)).sort();
    state.branches = [...pinned, ...rest];
    state.branchesLoaded = true;
  } catch (e) {
    state.branches = state.defaultBranches.slice();
    state.branchesLoaded = true;
    toast(`Could not load branches (${e.message}).`);
  } finally {
    state.branchesLoading = false;
    if (globalBranchSS) globalBranchSS.ss.setLoading(false);
    populateGlobalBranch();
  }
}

function populateGlobalBranch() {
  const cur = state.branch || "dev";
  const list = (state.branches && state.branches.length) ? state.branches.slice() : ["dev"];
  if (!list.includes(cur)) list.unshift(cur); // keep current selection valid
  if (globalBranchSS) { globalBranchSS.ss.setOptions(list); globalBranchSS.ss.setValue(cur); }
  state.branch = cur;
}

// ---- per-service override row (build branch + release env) ----
const ENV_OPTIONS = ["dev", "testing", "production"];

function buildOverrideRow(name, job) {
  // Build-branch override — searchable; "(global)" first, then this service's branches (lazy).
  const branchSS = searchableSelect({
    value: job.branchOverride || "",
    onOpen: () => { if (!job.branchesLoaded && !job.branchesLoading) loadServiceBranches(name, branchSS); },
    onChange: (v) => { job.branchOverride = v || null; },
  });
  fillBranchOverride(branchSS, job);

  // Release-env override — "(global)" + the three environments.
  const envSel = el("select", {
    onchange: (e) => { job.envOverride = e.target.value || null; }
  });
  envSel.append(optionEl("", `(global: ${state.environment})`, !job.envOverride));
  ENV_OPTIONS.forEach((env) => envSel.append(optionEl(env, env, job.envOverride === env)));

  // Branch drives both build and release, so it's relevant for every action.
  // Env is only irrelevant for build-only. Everything locks while a run is live.
  branchSS.ss.setDisabled(state.running);
  envSel.disabled = state.running || state.action === "build";

  return el("div", { class: "row" },
    el("div", {}, el("label", { class: "fld" }, "Build branch"), el("div", {}, branchSS)),
    el("div", {}, el("label", { class: "fld" }, "Release env"), el("div", {}, envSel)),
    el("button", { class: "btn ghost", title: "Reload branches",
      onclick: () => { job.branchesLoaded = false; loadServiceBranches(name, branchSS); } }, "↻"),
  );
}

function optionEl(value, label, selected) {
  const o = document.createElement("option");
  o.value = value; o.textContent = label; if (selected) o.selected = true;
  return o;
}

function fillBranchOverride(ss, job) {
  const cur = job.branchOverride || "";
  const list = (job.branches && job.branches.length) ? job.branches : state.defaultBranches;
  const opts = [{ value: "", label: `(global: ${state.branch})` }];
  list.forEach((b) => opts.push({ value: b, label: b }));
  if (cur && !list.includes(cur)) opts.push({ value: cur, label: cur });
  ss.ss.setOptions(opts);
  ss.ss.setValue(cur);
}

async function loadServiceBranches(name, ss) {
  const job = state.selected.get(name);
  if (!job || job.branchesLoading) return;
  job.branchesLoading = true;
  if (ss) ss.ss.setLoading(true);
  try {
    const res = await fetch(`/api/branches?service=${encodeURIComponent(name)}`);
    const data = await res.json();
    job.branches = (data.branches && data.branches.length) ? data.branches : state.defaultBranches;
    job.branchesLoaded = true;
    if (data.warning) toast(`${name}: ${data.warning} — showing defaults.`);
  } catch (e) {
    job.branches = state.defaultBranches; job.branchesLoaded = true;
    toast(`${name}: could not load branches (${e.message}).`);
  } finally {
    job.branchesLoading = false;
    if (ss) ss.ss.setLoading(false);
    if (ss) fillBranchOverride(ss, job);
  }
}

function renderSelected() {
  const area = $("#selected");
  area.innerHTML = "";
  if (state.selected.size === 0) {
    area.append(el("div", { class: "empty", html: "Pick one or more services on the left.<br/>Each gets a build-branch dropdown here." }));
    setRunningUI();
    return;
  }
  for (const [name, job] of state.selected) {
    const card = el("div", { class: "job-card" });

    // header row
    card.append(el("div", { class: "job-top" },
      el("span", { class: "svc" }, name),
      el("button", { class: "remove", title: "Remove", onclick: () => toggleService(name, false) }, "✕"),
    ));

    // per-service override row — leave on "(global)" to inherit the top dropdowns
    card.append(buildOverrideRow(name, job));

    // progress
    const prog = el("div", { class: "progress" + (Object.keys(job.progress).length ? " show" : "") });
    renderProgress(prog, job);
    card.append(prog);

    area.append(card);
  }
  setRunningUI();
}

function renderProgress(container, job) {
  container.innerHTML = "";
  ["build","release"].forEach(phase => {
    const p = job.progress[phase];
    if (!p) return;
    const meta = [];
    if (p.buildId) meta.push(`build #${p.buildId}`);
    if (p.releaseId) meta.push(`release #${p.releaseId}`);
    if (p.elapsed != null) meta.push(`${p.elapsed}s`);
    if (p.result) meta.push(p.result);
    const step = el("div", { class: "step" },
      el("span", { class: "dot " + p.status }),
      el("span", { class: "label" }, phase + ":"),
      el("span", { class: "meta" }, p.message || p.status),
    );
    if (meta.length) step.append(el("span", { class: "meta" }, "· " + meta.join(" · ")));
    if (p.url) step.append(el("a", { href: p.url, target: "_blank" }, "open ↗"));
    container.append(step);
  });
}

function updateFooter() {
  const n = state.selected.size;
  const par = state.parallel && state.action !== "build-release";
  const mode = par ? "in parallel" : "sequentially";
  $("#summary").textContent = state.running
    ? `running… · ${mode} · refresh-safe`
    : (n ? `${n} service${n>1?"s":""} · runs ${mode}` : "");
}

const ACTION_LABELS = { "build-release": "Build & Release", build: "Build", release: "Release" };
function setRunningUI() {
  const btn = $("#deploy");
  if (state.running) {
    btn.textContent = "Stop"; btn.disabled = false; btn.classList.add("ghost");
  } else {
    btn.classList.remove("ghost");
    btn.textContent = ACTION_LABELS[state.action] || "Run";
    btn.disabled = state.selected.size === 0;
  }
  // lock the top controls while a run is in progress
  const lock = state.running;
  $("#action").disabled = lock;
  if (globalBranchSS) globalBranchSS.ss.setDisabled(lock); // branch drives both build and release
  $("#release-env").disabled = lock || state.action === "build";

// kept for existing call sites
const updateActionUI = setRunningUI;

// ---- deploy: start a background run, then poll its status (refresh-safe) ----
async function deploy() {
  if (state.running || state.selected.size === 0) return;

  // reset progress locally for immediate feedback
  for (const job of state.selected.values()) job.progress = {};
  renderSelected();

  const jobs = [...state.selected.entries()].map(([service, j]) => ({
    service,
    branch: j.branchOverride || state.branch,
    environment: j.envOverride || state.environment,
    action: state.action,
  }));

  try {
    const res = await fetch("/api/deploy", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ jobs, parallel: state.parallel && state.action !== "build-release" }),
    });
    const data = await res.json();
    if (!res.ok) {
      toast(data.error || "Could not start run.");
      if (data.run) { state.running = data.run.status === "running"; applyRunSnapshot(data.run); if (state.running) startPolling(); }
      return;
    }
    state.running = true;
    setRunningUI();
    startPolling();
  } catch (e) {
    toast("Could not start run: " + e.message);
  }
}

async function stopRun() {
  try {
    await fetch("/api/stop", { method: "POST" });
    toast("Stopping — no further services will be triggered.");
  } catch (e) {
    toast("Stop failed: " + e.message);
  }
  // keep polling; the run's status will flip to "stopped" shortly
}

function startPolling() {
  clearTimeout(pollTimer);
  pollRun();
}

async function pollRun() {
  try {
    const res = await fetch("/api/status");
    const { run } = await res.json();
    if (run) applyRunSnapshot(run);
    if (run && run.status === "running") {
      pollTimer = setTimeout(pollRun, 1500);
    } else {
      state.running = false;
      if (run && run.result) {
        const verb = run.status === "stopped" ? "Stopped" : "Done";
        toast(`${verb} — ${run.result.succeeded} succeeded, ${run.result.failed} failed.`);
        // success chime only when everything passed; failures already played faaah.mp3 as they happened
        if (run.status !== "stopped" && run.result.failed === 0) playChime(true);
      }
      setRunningUI();
    }
  } catch (e) {
    pollTimer = setTimeout(pollRun, 2500); // transient — retry
  }
}

// Play the error sound the moment any build/release phase fails. Per-run scoped;
// the first snapshot of a run is seeded silently so a refresh won't replay old failures.
let _seenRunId = null;
let _seenFailures = new Set();
function checkFailures(run) {
  if (!run || !run.id) return;
  const failed = new Set();
  for (const [svc, phases] of Object.entries(run.progress || {})) {
    for (const [phase, p] of Object.entries(phases || {})) {
      if (p && (p.status === "failed" || p.status === "error")) failed.add(svc + "|" + phase);
    }
  }
  if (run.id !== _seenRunId) {
    // new run (or reattach) — seed current state without sounding
    _seenRunId = run.id;
    _seenFailures = failed;
    return;
  }
  for (const key of failed) {
    if (!_seenFailures.has(key)) { _seenFailures.add(key); playError(); }
  }
}

// Rebuild selection + progress from a server run snapshot (also used to reattach on refresh).
function applyRunSnapshot(run) {
  if (run.jobs && run.jobs.length) {
    const act = run.jobs[0].action || "build-release";
    state.action = act;
    const as = $("#action"); if (as) as.value = act;
  }
  if (typeof run.parallel === "boolean") state.parallel = run.parallel;
  checkFailures(run);
  (run.jobs || []).forEach((j) => {
    let job = state.selected.get(j.service);
    if (!job) {
      // service that was in the run but not in this (fresh) page — add it
      job = {
        progress: {}, branchOverride: j.branch || null, envOverride: j.environment || null,
        branches: null, branchesLoaded: false, branchesLoading: false,
      };
      state.selected.set(j.service, job);
    }
    job.progress = (run.progress && run.progress[j.service]) || job.progress || {};
  });
  renderServiceList();
  renderSelected();
}

const ondcSetStatus = (text, kind) => { const s = $("#ondc-status"); s.textContent = text; s.className = "ondc-status" + (kind ? " " + kind : ""); };

  innerObj.context.message_id = ondcUuid();
  innerObj.context.timestamp = new Date().toISOString();
  $("#ondc-payload").value = JSON.stringify(innerObj, null, 2);
  $("#ondc-ids").textContent = `txn: ${innerObj.context.transaction_id.slice(0,8)}… msg: ${innerObj.context.message_id.slice(0,8)}… @ ${innerObj.context.timestamp}`;

  const wrapper = { npType: "BAP", action: "search", domain: "Retail", body: innerObj };

  ondcSetStatus("Sending…", "pending");
  const btn = $("#ondc-trigger"); btn.disabled = true;
  $("#ondc-response").textContent = "Sending request…"; $("#ondc-meta").textContent = "";
  try {
    const res = await fetch("/api/ondc-search", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ env, payload: wrapper }),
    });
    const data = await res.json();
    if (!res.ok && data.error) {
      $("#ondc-response").textContent = "Error: " + data.error;
      $("#ondc-meta").textContent = ""; ondcSetStatus("Failed", "err"); return;
    }
    let pretty = data.body;
    try { pretty = JSON.stringify(JSON.parse(data.body), null, 2); } catch (_) {}
    $("#ondc-response").textContent = pretty || "(empty response)";
    $("#ondc-meta").textContent = `HTTP ${data.status} • ${data.elapsed} ms`;
    ondcSetStatus(data.ok ? `OK ${data.status}` : `Failed ${data.status}`, data.ok ? "ok" : "err");
  } catch (err) {
    $("#ondc-response").textContent = "Request failed: " + (err && err.message ? err.message : err);
    ondcSetStatus("Error", "err");
  } finally { btn.disabled = false; }
}
$("#ondc-env").addEventListener("change", ondcRefresh);
$("#ondc-regen").addEventListener("click", ondcRefresh);
$("#ondc-trigger").addEventListener("click", ondcTrigger);

// ===========================================================================
// Credentials / Reference vault — grouped key/value store persisted server-side
// (GET/PUT /api/credentials). Secret rows are masked with show/hide + copy.
// ===========================================================================
let credsData = { groups: [] };
let credsDirty = false;
let _cid = 0;
const newId = () => `c${++_cid}-${Date.now().toString(36)}`;
function setCredsDirty(on) {
  credsDirty = on;
  $("#creds-status").textContent = on ? "Unsaved changes" : "";
  $("#creds-status").style.color = on ? "var(--warn)" : "var(--muted)";
}
async function loadCreds() {
  try {
    const res = await fetch("/api/credentials");
    const data = await res.json();
    credsData = data && Array.isArray(data.groups) ? data : { groups: [] };
  } catch { credsData = { groups: [] }; }
  setCredsDirty(false);
  renderCreds();
}
// Small ⋮ overflow menu. items: [{ label, fn, danger }]
function dotsMenu(items) {
  const btn = el("button", { class: "icon-btn", title: "More" }, "⋮");
  const menu = el("div", { class: "dots-menu" });
  items.forEach((it) => menu.append(el("button", {
    class: "dots-item" + (it.danger ? " danger" : ""),
    onclick: (e) => { e.stopPropagation(); closeMenus(); it.fn(); },
  }, it.label)));
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = menu.classList.contains("open");
    closeMenus();
    if (!open) menu.classList.add("open");
  });
  return el("div", { class: "dots-wrap" }, btn, menu);
}
function closeMenus() { document.querySelectorAll(".dots-menu.open").forEach((m) => m.classList.remove("open")); }

// Inline eye / eye-off icon (stroke = currentColor, so it matches the icon button)
function eyeSvg(revealed) {
  const open = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  const off = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20C5 20 1 12 1 12a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${revealed ? off : open}</svg>`;
}

function renderCreds() {
  const wrap = $("#creds-groups");
  const q = ($("#creds-search").value || "").toLowerCase();
  wrap.innerHTML = "";
  if (!credsData.groups.length) {
    wrap.append(el("div", { class: "cred-empty", html: "No credentials yet. Click <b>+ Add group</b> to start." }));
    return;
  }
  credsData.groups.forEach((g) => {
    const rows = g.rows || (g.rows = []);
    const matchG = !q || g.name.toLowerCase().includes(q);
    const visibleRows = rows.filter((r) => matchG || r.label.toLowerCase().includes(q) || r.value.toLowerCase().includes(q));
    if (q && !matchG && visibleRows.length === 0) return;

    const nameEl = g._renaming
      ? el("input", { class: "gname", value: g.name, placeholder: "Group name",
          oninput: (e) => { g.name = e.target.value; setCredsDirty(true); },
          onblur: () => { g._renaming = false; renderCreds(); } })
      : el("span", { class: "gname-txt" }, g.name || "Untitled group");
    const head = el("div", { class: "cred-group-head" },
      nameEl,
      dotsMenu([
        { label: "+ Add row", fn: () => { rows.push({ id: newId(), label: "", value: "", secret: true, _editing: true }); setCredsDirty(true); renderCreds(); } },
        { label: "Rename group", fn: () => { g._renaming = true; renderCreds(); setTimeout(() => { const i = head.querySelector("input.gname"); if (i) i.focus(); }, 0); } },
        { label: "Delete group", danger: true, fn: () => { if (confirm(`Delete group "${g.name || "untitled"}"?`)) { credsData.groups = credsData.groups.filter((x) => x !== g); setCredsDirty(true); renderCreds(); } } },
      ]),
    );
    const rowsWrap = el("div", { class: "cred-rows" });
    if (!visibleRows.length) rowsWrap.append(el("div", { class: "sub", style: "padding:4px 2px;font-size:12px;" }, "No entries — use ⋮ → Add row."));
    visibleRows.forEach((r) => rowsWrap.append(r._editing ? credRowEdit(g, r) : credRowView(g, r)));
    wrap.append(el("div", { class: "cred-group" }, head, rowsWrap));
  });
}

// Read-only display row — masked secret, show/hide, copy, ⋮ (Edit / Delete).
function credRowView(g, r) {
  const masked = r.secret && !r._reveal;
  const valEl = el("span", { class: "cval" + (masked ? " masked" : "") }, masked ? "••••••••" : (r.value || "—"));
  const copy = el("button", { class: "icon-btn", title: "Copy value",
    onclick: () => navigator.clipboard.writeText(r.value || "").then(() => {
      copy.textContent = "✓"; copy.classList.add("copied-flash");
      setTimeout(() => { copy.textContent = "⧉"; copy.classList.remove("copied-flash"); }, 1000);
    }) }, "⧉");
  const kids = [el("span", { class: "clabel-txt" }, r.label || "(no label)"), valEl];
  if (r.secret) kids.push(el("button", { class: "icon-btn", title: r._reveal ? "Hide" : "Show",
    html: eyeSvg(r._reveal),
    onclick: () => { r._reveal = !r._reveal; renderCreds(); } }));
  kids.push(copy, dotsMenu([
    { label: "Edit", fn: () => { r._editing = true; renderCreds(); } },
    { label: "Delete", danger: true, fn: () => { g.rows = g.rows.filter((x) => x !== r); setCredsDirty(true); renderCreds(); } },
  ]));
  return el("div", { class: "cred-row" }, ...kids);
}

// Edit row — inline inputs; ✓ Done returns to read-only view.
function credRowEdit(g, r) {
  const done = () => { r._editing = false; r._reveal = false; renderCreds(); };
  return el("div", { class: "cred-row editing" },
    el("input", { class: "clabel", value: r.label, placeholder: "label",
      oninput: (e) => { r.label = e.target.value; setCredsDirty(true); } }),
    el("input", { class: "cvalue", value: r.value, placeholder: "value", type: "text",
      oninput: (e) => { r.value = e.target.value; setCredsDirty(true); },
      onkeydown: (e) => { if (e.key === "Enter") done(); } }),
    el("label", { class: "secret-tg" },
      el("input", { type: "checkbox", ...(r.secret ? { checked: "checked" } : {}),
        onchange: (e) => { r.secret = e.target.checked; setCredsDirty(true); } }), "secret"),
    el("button", { class: "icon-btn", title: "Done", onclick: done }, "✓"),
    el("button", { class: "icon-btn del", title: "Delete row",
      onclick: () => { g.rows = g.rows.filter((x) => x !== r); setCredsDirty(true); renderCreds(); } }, "✕"),
  );
}
async function saveCreds() {
  const btn = $("#creds-save"); btn.disabled = true;
  // strip transient UI flags (_editing/_reveal/_renaming) before persisting
  const groups = credsData.groups.map((g) => ({
    id: g.id, name: g.name,
    rows: (g.rows || []).map((r) => ({ id: r.id, label: r.label, value: r.value, secret: !!r.secret })),
  }));
  try {
    const res = await fetch("/api/credentials", {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ groups }),
    });
    if (res.ok) { setCredsDirty(false); $("#creds-status").textContent = "Saved"; $("#creds-status").style.color = "var(--ok)"; }
    else { const d = await res.json().catch(() => ({})); toast(d.error || "Save failed"); }
  } catch (e) { toast("Save failed: " + e.message); }
  finally { btn.disabled = false; }
}
$("#creds-add-group").addEventListener("click", () => {
  credsData.groups.push({ id: newId(), name: "New group", rows: [] });
  setCredsDirty(true); renderCreds();
});
$("#creds-save").addEventListener("click", saveCreds);
$("#creds-search").addEventListener("input", renderCreds);
document.addEventListener("click", closeMenus); // close any open ⋮ menu on outside click

// ---- tab switching ----
let _ondcInit = false, _credsInit = false;
function switchView(view) {
  document.querySelectorAll(".tabs .tab").forEach((t) => t.classList.toggle("active", t.dataset.view === view));
  $("#view-deploy").style.display = view === "deploy" ? "" : "none";
  $("#view-ondc").style.display = view === "ondc" ? "" : "none";
  $("#view-creds").style.display = view === "creds" ? "" : "none";
  if (view === "ondc" && !_ondcInit) { _ondcInit = true; ondcRefresh(); }
  if (view === "creds" && !_credsInit) { _credsInit = true; loadCreds(); }
}
document.querySelectorAll(".tabs .tab").forEach((t) => t.addEventListener("click", () => switchView(t.dataset.view)));

init();
</script>
</body>
</html>
